name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Upload Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      # llama.cpp is fetched at build time and is never required
      # to be committed into the Git repository.
      - name: Install and build llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          LLAMA_DIR="$GITHUB_WORKSPACE/third-party/llama.cpp"
          LLAMA_REPO="https://github.com/ggml-org/llama.cpp.git"

          rm -rf "$LLAMA_DIR"
          mkdir -p "$(dirname "$LLAMA_DIR")"

          git clone --depth 1 "$LLAMA_REPO" "$LLAMA_DIR"

          cd "$LLAMA_DIR"
          make -j"$(nproc)"

          test -f llama-cli || test -f build/bin/llama-cli

      - name: Verify project scripts
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f android/gradlew
          test -f apps/mobile/package.json

          chmod +x android/gradlew

      - name: Build web app and sync Android
        run: npm run android:sync

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          echo "APK generated:"
          ls -lh "$APK"

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          cp "$APK" artifacts/lingua-assistant-debug.apk

          cd artifacts
          zip -9 lingua-assistant-debug-apk.zip lingua-assistant-debug.apk

          ls -lh *

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingua-assistant-debug-apk
          path: artifacts/lingua-assistant-debug-apk.zip
          if-no-files-found: error
          retention-days: 14
