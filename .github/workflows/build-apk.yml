name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and Ninja
        run: |
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;27.0.12077973"

      - name: Install llama.cpp
        run: |
          chmod +x scripts/install_llama.sh
          ../scripts/install_llama.sh

      - name: Verify llama.cpp
        run: |
          test -f third-party/llama.cpp/CMakeLists.txt
          test -f third-party/llama.cpp/include/llama.h
          echo "llama.cpp source verified"

      - name: Install npm dependencies
        run: npm install

      - name: Build web app and sync into Android project
        run: npm run android:sync

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingua-assistant-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
