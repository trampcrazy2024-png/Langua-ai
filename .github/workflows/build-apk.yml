name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload Debug APK (Zipped)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      # نصب و کامپایل llama.cpp مستقیماً در محیط CI
      - name: Install and build llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          LLAMA_DIR="$GITHUB_WORKSPACE/third-party/llama.cpp"
          LLAMA_REPO="https://github.com/ggml-org/llama.cpp.git"

          rm -rf "$LLAMA_DIR"
          mkdir -p "$(dirname "$LLAMA_DIR")"

          git clone --depth 1 "$LLAMA_REPO" "$LLAMA_DIR"

          cmake -S "$LLAMA_DIR" \
                -B "$LLAMA_DIR/build" \
                -DCMAKE_BUILD_TYPE=Release \
                -DGGML_NATIVE=OFF

          cmake --build "$LLAMA_DIR/build" \
                --config Release \
                --parallel "$(nproc)"

          test -f "$LLAMA_DIR/build/bin/llama-cli"

      # ساخت وب‌اپ و سینک کردن آن با اندروید
      - name: Build web app and sync into the Android project
        run: npm run android:sync

      # اجرای بیلد داخل پوشه‌ی اندروید
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # آپلود خروجی به صورت زیپ‌شده
      - name: Upload Debug APK Artifact (Zipped)
        uses: actions/upload-artifact@v4
        with:
          name: lingua-assistant-debug-apk
          path: android/app/build/outputs/apk/
